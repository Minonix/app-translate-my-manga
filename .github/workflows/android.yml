name: android

on:
  push:
    branches: [main, feat/v1-android]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Cle de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tmm-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=tmm\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/tmm-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Tests, lint, APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "TMM-Mobile-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "TMM-Mobile-${GITHUB_REF_NAME}.apk" \
            --title "TMM Mobile ${GITHUB_REF_NAME}" --generate-notes
